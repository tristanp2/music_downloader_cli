# music_downloader settings (TEMPLATE -- copy to settings.conf and fill in)
# Lines starting with # are ignored. Use 'key = value' format.
# This file is committed as a reference; config/settings.conf (gitignored) is the real one.

# Spotify developer-app credentials (from https://developer.spotify.com/dashboard)
spotify-id = <your spotify client id>
spotify-secret = <your spotify client secret>

# Output directory for downloaded FLACs. The playlist name is appended as a
# subfolder. Leave commented to use the default (~/Music/music_downloader_outputs).
# Supports ~ for home and absolute paths.
output_dir = <your output directory>

# Daily backup destination (copied by scripts/backup_outputs.py via the
# Hermes cronjob). Additive only: files are copied when new/changed, never
# deleted on the backup. Supports ~ and absolute paths. Leave unset to use
# the default (D:/Downloads/music_backup).
# backup_dir = <your backup directory>

# list of usernames that can be downloaded to. default is first in list
users = user1,user2

# Network interface the web server binds to. 0.0.0.0 = all interfaces
# (LAN + Tailscale + localhost). Your LAN IP = that NIC only, so coworkers on the
# work Tailscale cannot reach the UI. Override at launch with env MUSIC_DOWNLOADER_BIND_HOST.
# Change this if your LAN IP changes.
bind_host = <your LAN IP, e.g. 10.0.0.80>

# Optional: require an X-Auth-Token header matching this value on POST /download.
# Leave unset for no auth (localhost/LAN use). GETs (UI, job list) stay open.
# Can also be set via env MUSIC_DOWNLOADER_SERVER_TOKEN.
# server_token = <shared secret>

# Periodic sync: the server re-enqueues every known playlist as a download job
# on this interval (hours). 0 or negative disables the periodic sync. A manual
# sync is always available via POST /sync from the frontend. Default 12h.
sync_interval_hours = 12

# Log rotation: cap each log file at log_max_bytes (default 5 MB) and keep
# log_backups rotations (default 5, so ~25 MB ceiling). Old logs roll off.
# Override at launch with env MUSIC_DOWNLOADER_LOG_MAX_BYTES / MUSIC_DOWNLOADER_LOG_BACKUPS.
# Leave unset to use defaults.
# log_max_bytes = 5242880
# log_backups = 5

# Soulseek fallback: when a Deezer pass leaves tracks "missed", the server
# enqueues a parallel Soulseek sweep (via tools/sockseek.exe) to fetch them
# from the P2P network. Requires tools/sockseek.exe + tools/sockseek.conf to
# exist. Set to 1 to enable. 0/absent = disabled (Deezer pass still completes).
# Deezer ALWAYS overrides Soulseek on collision (see SOULSEEK_FALLBACK_PLAN.md).
# soulseek_enabled = 0
