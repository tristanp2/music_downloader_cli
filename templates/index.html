<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music-downloader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    color-scheme: dark;
    --bg:       #000000;
    --bg-card:  #050505;
    --bg-input: #020202;
    --border:   #151515;
    --border-h: #282828;
    --accent:   #ffffff;
    --accent-d: #888888;
    --ok:       #cccccc;
    --warn:     #777777;
    --err:      #555555;
    --text:     #aaaaaa;
    --text-d:   #444444;
    --text-b:   #dddddd;
    --mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: var(--mono);
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    font-size: 13px;
    /* Lock the page to the viewport: the page itself never scrolls. Individual
       regions (job queue, library) scroll internally instead. */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* On very short screens, don't trap content -- let the page scroll. */
  @media (max-height: 560px) {
    html, body { height: auto; overflow: auto; }
    main { height: auto; }
  }

  /* subtle scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.008) 2px,
      rgba(255,255,255,0.008) 4px
    );
    z-index: 9999;
  }

  /* ---- header ---- */
  header {
    padding: 12px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
    color: var(--text-b);
    letter-spacing: 0.02em;
  }

  #user-select {
    padding: 3px 8px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  #user-select:hover, #user-select:focus { border-color: var(--border-h); }

  #health {
    font-size: 11px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-d);
    transition: all 0.3s;
  }
  #health.ok { color: var(--ok); border-color: var(--accent-d); }
  #health.bad { color: var(--err); border-color: var(--err); }

  /* ---- layout ---- */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 14px 20px;
    /* Fill the space under the header and clip -- children scroll, not the page. */
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* ---- cards ---- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  /* Only the scrollable cards (job queue, library) become flex columns so their
     inner region can scroll instead of expanding the page. The "new download"
     card stays a normal block so its input/buttons lay out inline. */
  .card:has(> #jobs),
  .card.job-tabs-card,
  .card:has(> .lib-scroll) {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px;
    height: 100%;
    background: var(--border-h);
    transition: background 0.3s;
  }
  .card:hover::before { background: var(--accent-d); }

  .card h2 {
    font-size: 12px;
    margin: 0 0 12px;
    color: var(--text-d);
    letter-spacing: 0.08em;
  }

  /* ---- input / button ---- */
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type=text]:focus {
    border-color: var(--accent-d);
  }
  input[type=text]::placeholder { color: var(--text-d); }

  button {
    margin-top: 10px;
    padding: 7px 16px;
    background: transparent;
    border: 1px solid var(--accent-d);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.06em;
  }
  button:hover {
    background: var(--text-b);
    color: var(--bg);
  }
  button:active { transform: scale(0.97); }

  .zip-btn {
    margin-top: 6px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--accent-d);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .zip-btn:hover {
    background: var(--text-b);
    color: var(--bg);
  }

  .empty { color: var(--text-d); font-size: 11px; }

  /* ---- job cards (tabbed: Jobs / Fallback, each pane = original queue look) ---- */
  .job-tab-bar { display: flex; }
  .job-tab {
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.06em;
    padding: 4px 14px; margin: 0;
    background: transparent; color: var(--text-d);
    border: 1px solid var(--border); cursor: pointer;
    border-bottom: none;
    user-select: none;
  }
  .job-tab:hover { color: var(--text); border-color: var(--border-h); }
  .job-tab.active { color: var(--text-b); border-color: var(--accent-d); background: var(--accent-d); }
  .job-tab #fallback-count { font-size: 10px; opacity: 0.85; }
  /* The pane IS the scroll container, mirroring the original #jobs: flex column,
     min-height:0 so it can shrink, overflow scrolls. This is what was missing
     from the first broken tab version (panels were display:none w/ no height). */
  .job-tab-pane {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px;
    padding-right: 4px;
    border: #252525 1px solid;
  }
  .job-tab-pane.active { display: block; }
  .job {
    border: 1px solid var(--border);
    padding: 10px;
    margin-bottom: 8px;
    background: var(--bg);
    transition: border-color 0.3s;
  }
  .job.running { border-color: var(--accent-d); }
  .job.done    { border-color: var(--ok); }
  .job.error   { border-color: var(--err); }

  .job .meta { font-size: 11px; color: var(--text-d); margin-bottom: 4px; word-break: break-all; }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border: 1px solid var(--border);
    letter-spacing: 0.06em;
  }
  .badge.running { border-color: var(--accent-d); color: var(--text-b); }
  .badge.queued  { border-color: var(--warn); color: var(--warn); }
  .badge.done    { border-color: var(--ok); color: var(--text-b); }
  .badge.error   { border-color: var(--err); color: var(--err); }

  /* collapsible job header (click to expand/collapse the track list) */
  .job-header { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .job-chevron { color: var(--text-d); font-size: 10px; width: 12px; text-align: center; transition: transform 0.2s; flex-shrink: 0; }
  .job-chevron.open { transform: rotate(90deg); color: var(--text-b); }
  .job-header .meta { margin-bottom: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .job-header .pname { color: var(--text-b); font-weight: 500; }
  .job-header .clock { color: var(--text-d); font-size: 10px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .job-url { color: var(--text-d); font-size: 10px; margin: 2px 0 4px 20px; word-break: break-all; }
  .results { display: flex; gap: 4px; flex-shrink: 0; }
  .chip { font-size: 10px; padding: 1px 5px; border: 1px solid var(--border); color: var(--text-d); letter-spacing: 0.04em; }
  .chip.ok   { border-color: var(--border-h); color: var(--text-b); }
  .chip.warn { border-color: var(--border-h); color: var(--text); }
  .chip.miss { border-color: var(--border-h); color: var(--text); }
  .chip.err  { border-color: var(--border-h); color: var(--text); }

  /* ---- track list (job progress) ---- */
  .track-list { margin-top: 6px; }
  .track-row { display: flex; align-items: center; gap: 6px; padding: 3px 2px; border-bottom: 1px solid var(--border); }
  .track-row:last-child { border-bottom: none; }
  .track-row .pos { color: var(--text-d); font-size: 10px; font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
  .track-name { font-size: 11px; flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-name.pending { color: var(--text-d); }
  .mini-bar { flex: 1; height: 3px; background: var(--border); overflow: hidden; }
  .mini-bar .fill { height: 100%; background: var(--accent-d); transition: width 0.3s ease; }
  .mini-bar .fill.done { background: var(--ok); width: 100%; }
  .track-status { min-width: 16px; text-align: center; font-size: 12px; line-height: 1; }
  .track-status.pending     { color: var(--text-d); }
  .track-status.downloading { color: var(--text-b); }
  .track-status.downloaded  { color: var(--ok); }
  .track-status.skipped     { color: var(--text-b); }
  .track-status.missed      { color: var(--warn); }
  .track-status.failed      { color: var(--err); }

  /* ---- table ---- */
  #playlists { width: 100%; border-collapse: collapse; font-size: 11px; }
  .lib-scroll { 
    flex: 1; 
    min-height: 0; 
    overflow-y: auto;
    padding-right: 4px; 
    border: #252525 1px solid;
  }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { background: var(--bg); color: var(--text-d); font-weight: 500;  font-size: 10px; letter-spacing: 0.06em; }
  a { color: var(--text-b); text-decoration: none; transition: color 0.2s; }
  a:hover { color: var(--accent); text-shadow: 0 0 6px rgba(255,255,255,0.15); }

  /* ---- library expansion ---- */
  .lib-row { cursor: pointer; transition: background 0.15s; }
  .lib-row:hover { background: rgba(255,255,255,0.03); }
  .lib-detail { display: none; }
  .lib-detail.open { display: table-row; }
  .lib-detail td { padding: 0; background: var(--bg); }
  .lib-detail-inner { padding: 6px 10px; }

  .lib-track { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .lib-track:last-child { border-bottom: none; }
  .lib-track .lt-pos { color: var(--text-d); min-width: 26px; text-align: right; font-size: 10px; padding-left:10px; padding-right: 20px;}
  .lib-track .lt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-track .lt-status { min-width: 16px; text-align: center; font-size: 12px; }
  .lib-track:hover { background: #ffffff03; }
  .lt-status.downloaded { color: var(--ok); }
  .lt-status.missed     { color: var(--warn); }
  .lt-status.skipped    { color: var(--text-b); }
  .lt-status.failed     { color: var(--err); }
  .lib-track .lt-dl-cell { min-width: 22px; text-align: center; }
  .lt-dl { color: var(--text-b); text-decoration: none; border-bottom: 1px dotted var(--border-h); }
  .lt-dl:hover { color: #fff; }

  .lt-chevron { min-width: 16px; text-align: center; color: var(--text-d); font-size: 11px; transition: transform 0.25s ease; }
  .lt-chevron.open { transform: rotate(90deg); color: var(--text-b); }

  /* scrollbar styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-h); }

  .update-link, .zip-link { color: var(--text-b); text-decoration: none; border-bottom: 1px dotted var(--border-h); }
  .update-link:hover, .zip-link:hover { color: #fff; }

  /* full-screen "server down" overlay: dims content below the top bar + blocks clicks */
  .server-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
  }
  .server-overlay.show { display: flex; }
  .server-overlay .sad {
    font-family: var(--mono);
    font-size: 72px;
    color: var(--text-b);
    letter-spacing: 4px;
    user-select: none;
  }
  .server-overlay .sub {
    position: absolute;
    bottom: 12%;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-d);
  }
  /* keep the top bar above the overlay so it stays visible + interactive */
  header { position: relative; z-index: 60; }
</style>
</head>
<body>
<header>
  <h1>music-downloader</h1>
  <select id="user-select"></select>
  <span id="health" class="bad">checking...</span>
</header>
<main>
  <section class="card">
    <h2>new download</h2>
    <input id="url" type="text" placeholder="https://open.spotify.com/playlist/..." />
    <button id="go">[ queue ]</button>
    <button id="sync">[ sync all ]</button>
    <div id="msg" class="stats"></div>
  </section>

  <section class="card job-tabs-card">
    <h2>job queue</h2>
    <div class="job-tab-bar">
      <div id="tab-jobs" class="job-tab active">Jobs</div>
      <div id="tab-fallback" class="job-tab">Fallback <span id="fallback-count"></span></div>
    </div>
    <div id="jobs" class="job-tab-pane active"><div class="empty">No jobs yet.</div></div>
    <div id="fallback-jobs" class="job-tab-pane"><div class="empty">No fallback jobs yet.</div></div>
  </section>

  <section class="card" style="grid-column: 1 / -1;">
    <h2>library</h2>
    <div class="lib-scroll">
    <table id="playlists">
      <thead><tr><th></th><th>name</th><th>total</th><th>down</th><th>miss</th><th>fetched</th><th>update</th><th>zip</th></tr></thead>
      <tbody><tr><td colspan="8" class="empty">loading...</td></tr></tbody>
    </table>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
<div id="serverOverlay" class="server-overlay">
  <div class="sad">:(</div>
  <div class="sub">server down &mdash; reconnecting...</div>
</div>
</body>
</html>
