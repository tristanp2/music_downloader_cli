<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music-downloader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    color-scheme: dark;
    --bg:       #000000;
    --bg-card:  #050505;
    --bg-input: #020202;
    --border:   #151515;
    --border-h: #282828;
    --accent:   #ffffff;
    --accent-d: #888888;
    --ok:       #cccccc;
    --warn:     #777777;
    --err:      #555555;
    --text:     #aaaaaa;
    --text-d:   #444444;
    --text-b:   #dddddd;
    --mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--mono);
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    font-size: 13px;
  }

  /* subtle scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.008) 2px,
      rgba(255,255,255,0.008) 4px
    );
    z-index: 9999;
  }

  /* ---- header ---- */
  header {
    padding: 12px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
    color: var(--text-b);
    letter-spacing: 0.02em;
  }

  #user-select {
    padding: 3px 8px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  #user-select:hover, #user-select:focus { border-color: var(--border-h); }

  #health {
    font-size: 11px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-d);
    transition: all 0.3s;
  }
  #health.ok { color: var(--ok); border-color: var(--accent-d); }
  #health.bad { color: var(--err); border-color: var(--err); }

  /* ---- layout ---- */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 14px 20px;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* ---- cards ---- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px;
    height: 100%;
    background: var(--border-h);
    transition: background 0.3s;
  }
  .card:hover::before { background: var(--accent-d); }

  .card h2 {
    font-size: 12px;
    margin: 0 0 12px;
    color: var(--text-d);
    letter-spacing: 0.08em;
  }

  /* ---- input / button ---- */
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type=text]:focus {
    border-color: var(--accent-d);
  }
  input[type=text]::placeholder { color: var(--text-d); }

  button {
    margin-top: 10px;
    padding: 7px 16px;
    background: transparent;
    border: 1px solid var(--accent-d);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.06em;
  }
  button:hover {
    background: var(--text-b);
    color: var(--bg);
  }
  button:active { transform: scale(0.97); }

  .zip-btn {
    margin-top: 6px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--accent-d);
    color: var(--text-b);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .zip-btn:hover {
    background: var(--text-b);
    color: var(--bg);
  }

  .stats { font-size: 11px; color: var(--text-d); margin-top: 4px; }
  .error-summary { font-size: 11px; color: var(--err); margin-top: 4px; }

  .empty { color: var(--text-d); font-size: 11px; }

  /* ---- job cards ---- */
  .job {
    border: 1px solid var(--border);
    padding: 10px;
    margin-bottom: 8px;
    background: var(--bg);
    transition: border-color 0.3s;
  }
  .job.running { border-color: var(--accent-d); }
  .job.done    { border-color: var(--ok); }
  .job.error   { border-color: var(--err); }

  .job .meta { font-size: 11px; color: var(--text-d); margin-bottom: 4px; word-break: break-all; }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border: 1px solid var(--border);
    letter-spacing: 0.06em;
  }
  .badge.running { border-color: var(--accent-d); color: var(--text-b); }
  .badge.done    { border-color: var(--ok); color: var(--text-b); }
  .badge.error   { border-color: var(--err); color: var(--err); }

  /* ---- track list (job progress) ---- */
  .track-list { max-height: 400px; overflow-y: auto; margin-top: 6px; }
  .track-row { display: flex; align-items: center; gap: 6px; padding: 3px 2px; border-bottom: 1px solid var(--border); }
  .track-row:last-child { border-bottom: none; }
  .track-row .pos { color: var(--text-d); font-size: 10px; font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
  .track-name { font-size: 11px; flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-name.pending { color: var(--text-d); }
  .mini-bar { flex: 1; height: 3px; background: var(--border); overflow: hidden; }
  .mini-bar .fill { height: 100%; background: var(--accent-d); transition: width 0.3s ease; }
  .mini-bar .fill.done { background: var(--ok); width: 100%; }
  .track-status { min-width: 16px; text-align: center; font-size: 12px; line-height: 1; }
  .track-status.pending     { color: var(--text-d); }
  .track-status.downloading { color: var(--text-b); }
  .track-status.downloaded  { color: var(--ok); }
  .track-status.skipped     { color: var(--text-b); }
  .track-status.missed      { color: var(--warn); }
  .track-status.failed      { color: var(--err); }

  /* ---- table ---- */
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-d); font-weight: 500;  font-size: 10px; letter-spacing: 0.06em; }
  a { color: var(--text-b); text-decoration: none; transition: color 0.2s; }
  a:hover { color: var(--accent); text-shadow: 0 0 6px rgba(255,255,255,0.15); }

  /* ---- library expansion ---- */
  .lib-row { cursor: pointer; transition: background 0.15s; }
  .lib-row:hover { background: rgba(255,255,255,0.03); }
  .lib-detail { display: none; }
  .lib-detail.open { display: table-row; }
  .lib-detail td { padding: 0; background: var(--bg); }
  .lib-detail-inner { padding: 6px 10px; max-height: 300px; overflow-y: auto; }

  .lib-track { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .lib-track:last-child { border-bottom: none; }
  .lib-track .lt-pos { color: var(--text-d); min-width: 26px; text-align: right; font-size: 10px; padding-left:10px; padding-right: 20px;}
  .lib-track .lt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-track .lt-status { min-width: 16px; text-align: center; font-size: 12px; }
  .lt-status.downloaded { color: var(--ok); }
  .lt-status.missed     { color: var(--warn); }
  .lt-status.skipped    { color: var(--text-b); }
  .lt-status.failed     { color: var(--err); }

  .lt-chevron { min-width: 16px; text-align: center; color: var(--text-d); font-size: 11px; transition: transform 0.25s ease; }
  .lt-chevron.open { transform: rotate(90deg); color: var(--text-b); }

  /* scrollbar styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-h); }

  .update-link, .zip-link { color: var(--text-b); text-decoration: none; border-bottom: 1px dotted var(--border-h); }
  .update-link:hover, .zip-link:hover { color: #fff; }
</style>
</head>
<body>
<header>
  <h1>music-downloader</h1>
  <select id="user-select"></select>
  <span id="health" class="bad">checking...</span>
</header>
<main>
  <section class="card">
    <h2>new download</h2>
    <input id="url" type="text" placeholder="https://open.spotify.com/playlist/..." />
    <button id="go">[ queue ]</button>
    <div id="msg" class="stats"></div>
  </section>

  <section class="card">
    <h2>job queue</h2>
    <div id="jobs"><div class="empty">No jobs yet.</div></div>
  </section>

  <section class="card" style="grid-column: 1 / -1;">
    <h2>library</h2>
    <table id="playlists">
      <thead><tr><th></th><th>folder</th><th>name</th><th>total</th><th>down</th><th>miss</th><th>fetched</th><th>update</th><th>zip</th></tr></thead>
      <tbody><tr><td colspan="9" class="empty">loading...</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get("token") || null;

// nicer unicode icons
const icons = {
  pending:     "\u2022",      // bullet
  downloading: "\u25c9",      // white diamond
  downloaded:  "\u2713",      // checkmark
  skipped:     "\u27a4",      // heavy arrowhead
  missed:      "\u2717",      // X
  failed:      "\u26a0",      // warning
};

/* ---- current user (localStorage) ---- */
function getUser() {
  var v = localStorage.getItem("musicdl_user");
  if (v === "tristan" || v === "marc") return v;
  return "tristan";
}
function setUser(v) {
  localStorage.setItem("musicdl_user", v);
  for (var fid in knownLib) {
    knownLib[fid].row.remove();
    knownLib[fid].detail.remove();
    delete knownLib[fid];
  }
  for (var folder in libCache) delete libCache[folder];
}

async function initUserSelect() {
  try {
    const r = await fetch("/users");
    const data = await r.json();
    const sel = $("#user-select");
    sel.innerHTML = "";
    var users = data.users || [];
    for (var i = 0; i < users.length; i++) {
      var opt = document.createElement("option");
      opt.value = users[i];
      opt.textContent = users[i];
      sel.appendChild(opt);
    }
    var saved = localStorage.getItem("musicdl_user");
    sel.value = saved && users.indexOf(saved) !== -1 ? saved : (data.default || "");
    sel.addEventListener("change", function() {
      setUser(sel.value);
      refreshPlaylists();
      refreshJobs();
    });
  } catch {
    var sel = $("#user-select");
    sel.innerHTML = '<option value="tristan">tristan</option>';
    sel.value = getUser();
    sel.addEventListener("change", function() {
      setUser(sel.value);
      refreshPlaylists();
      refreshJobs();
    });
  }
}
initUserSelect();

/* ---- keyed DOM rendering ---- */
const knownJobs = {};
const knownLib = {};
const libCache = {};

function esc(s) {
  if (!s) return "";
  return s.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}

function ensureJobCard(j) {
  let ctx = knownJobs[j.id];
  if (ctx) return ctx;

  const card = document.createElement("div");
  card.className = "job " + j.status;
  card.dataset.job = j.id;

  const metaEl = document.createElement("div");
  metaEl.className = "meta";
  card.appendChild(metaEl);

  const listEl = document.createElement("div");
  listEl.className = "track-list";
  listEl.style.display = "none";
  card.appendChild(listEl);

  const summaryEl = document.createElement("div");
  summaryEl.className = "stats";
  card.appendChild(summaryEl);

  $("#jobs").appendChild(card);
  const empty = $("#jobs .empty");
  if (empty) empty.remove();

  ctx = { el: card, metaEl, listEl, summaryEl };
  knownJobs[j.id] = ctx;
  return ctx;
}

function renderTrackRow(listEl, track, total) {
  let row = listEl.querySelector('.track-row[data-pos="' + track.pos + '"]');
  if (!row) {
    row = document.createElement("div");
    row.className = "track-row";
    row.dataset.pos = track.pos;

    const posEl = document.createElement("span");
    posEl.className = "pos";
    row.appendChild(posEl);

    const nameSpan = document.createElement("span");
    nameSpan.className = "track-name";
    row.appendChild(nameSpan);

    const barWrap = document.createElement("div");
    barWrap.className = "mini-bar";
    const barFill = document.createElement("div");
    barFill.className = "fill";
    barWrap.appendChild(barFill);
    row.appendChild(barWrap);

    const statusEl = document.createElement("span");
    statusEl.className = "track-status";
    row.appendChild(statusEl);

    listEl.appendChild(row);
  }

  row.querySelector(".pos").textContent = track.pos + "/" + total;

  const nameSpan2 = row.querySelector(".track-name");
  nameSpan2.textContent = track.name;
  nameSpan2.title = track.name;
  nameSpan2.className = "track-name" + (track.status === "pending" ? " pending" : "");

  const barWrap2 = row.querySelector(".mini-bar");
  const barFill2 = row.querySelector(".mini-bar .fill");
  const showBar = (track.status === "downloading" || track.status === "downloaded" || track.status === "skipped");
  barWrap2.style.display = showBar ? "" : "none";
  if (track.status === "downloading") {
    barFill2.style.width = (track.pct != null ? track.pct : 0) + "%";
    barFill2.className = "fill";
  } else {
    barFill2.style.width = "100%";
    barFill2.className = "fill done";
  }

  const statusEl2 = row.querySelector(".track-status");
  statusEl2.className = "track-status " + track.status;
  statusEl2.textContent = icons[track.status] || "";
}

function updateJobCard(j) {
  const ctx = ensureJobCard(j);
  const { el, metaEl, listEl, summaryEl } = ctx;

  el.className = "job " + (j.status === "done" ? "done" : j.status === "error" ? "error" : "running");

  const badgeStatus = j.status === "done" ? "done" : j.status === "error" ? "error" : "running";
  metaEl.innerHTML = '<span class="badge ' + badgeStatus + '">' + esc(j.status) + '</span> &nbsp; ' + esc(j.url);

  const p = j.progress || {};
  const total = p.total || 0;
  const tracksMap = p.tracks || {};
  const trackArr = Object.values(tracksMap).sort(function(a, b) { return a.pos - b.pos; });
  for (let i = 0; i < trackArr.length; i++) {
    renderTrackRow(listEl, trackArr[i], total);
  }

  listEl.style.display = (trackArr.length || j.status === "running") ? "" : "none";

  if (j.result && j.result.ok) {
    const r = j.result;
    summaryEl.className = "stats";
    summaryEl.textContent = "downloaded " + r.downloaded + " / skipped " + r.skipped + " / missed " + r.missed + " / failed " + r.failed;
  } else if (j.result && j.result.error) {
    summaryEl.className = "error-summary";
    summaryEl.textContent = j.result.error;
  } else {
    summaryEl.className = "stats";
    summaryEl.textContent = "";
  }
}

function syncJobs(jobs) {
  const jobIds = new Set();
  for (let i = 0; i < jobs.length; i++) {
    jobIds.add(jobs[i].id);
  }

  for (let i = 0; i < jobs.length; i++) {
    updateJobCard(jobs[i]);
  }

  for (const id in knownJobs) {
    if (!jobIds.has(id)) {
      knownJobs[id].el.remove();
      delete knownJobs[id];
    }
  }

  if (!jobs.length) {
    const box = $("#jobs");
    if (!box.querySelector(".empty")) {
      box.innerHTML = '<div class="empty">No jobs yet.</div>';
    }
  }
}

/* ---- fetchers ---- */

async function postDownload(url) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["X-Auth-Token"] = token;
  const r = await fetch("/download?user=" + encodeURIComponent(getUser()), {
    method: "POST", headers, body: JSON.stringify({ url })
  });
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail || r.statusText); }
  return r.json();
}

async function refreshHealth() {
  try {
    const r = await fetch("/health");
    const h = $("#health");
    if (r.ok) { h.textContent = "up"; h.className = "ok"; }
    else { h.textContent = "down"; h.className = "bad"; }
  } catch { $("#health").textContent = "server down"; $("#health").className = "bad"; }
}

async function refreshJobs() {
  try {
    const r = await fetch("/jobs?user=" + encodeURIComponent(getUser()));
    const data = await r.json();
    syncJobs(data.jobs || []);
  } catch {}
}

/* ---- SSE: real-time job progress ---- */
const activeSSE = {};

function watchJob(jobId) {
  if (activeSSE[jobId]) return; // already watching
  const es = new EventSource("/jobs/" + encodeURIComponent(jobId) + "/events");
  activeSSE[jobId] = es;

  es.addEventListener("tracks", function(e) {
    var d = JSON.parse(e.data);
    var ctx = knownJobs[jobId];
    if (!ctx) return;
    ctx.listEl.style.display = "";
    for (var i = 0; i < d.items.length; i++) {
      var t = { pos: d.items[i].pos, name: d.items[i].name, status: "pending", pct: 0 };
      renderTrackRow(ctx.listEl, t, d.total);
    }
  });

  es.addEventListener("start", function(e) {
    var d = JSON.parse(e.data);
    var ctx = knownJobs[jobId];
    if (!ctx) return;
    var row = ctx.listEl.querySelector('.track-row[data-pos="' + d.pos + '"]');
    if (row) {
      row.querySelector(".track-name").className = "track-name";
      renderTrackRow(ctx.listEl, { pos: d.pos, name: d.name, status: "downloading", pct: 0 }, ctx.listEl.querySelectorAll(".track-row").length);
    }
  });

  es.addEventListener("pct", function(e) {
    var d = JSON.parse(e.data);
    var ctx = knownJobs[jobId];
    if (!ctx) return;
    var row = ctx.listEl.querySelector('.track-row[data-pos="' + d.pos + '"]');
    if (!row) return;
    var barFill = row.querySelector(".mini-bar .fill");
    if (barFill) {
      barFill.style.width = (d.pct || 0) + "%";
      barFill.className = "fill";
    }
    var barWrap = row.querySelector(".mini-bar");
    if (barWrap) barWrap.style.display = "";
    var statusEl = row.querySelector(".track-status");
    if (statusEl) {
      statusEl.className = "track-status downloading";
      statusEl.textContent = icons.downloading;
    }
  });

  es.addEventListener("done", function(e) {
    var d = JSON.parse(e.data);
    var ctx = knownJobs[jobId];
    if (!ctx) return;
    var row = ctx.listEl.querySelector('.track-row[data-pos="' + d.pos + '"]');
    if (!row) return;
    // Preserve the existing track name so renderTrackRow doesn't blank it.
    var existingName = row.querySelector(".track-name").textContent;
    renderTrackRow(ctx.listEl, { pos: d.pos, name: existingName, status: d.status, pct: d.pct }, ctx.listEl.querySelectorAll(".track-row").length);
  });

  es.addEventListener("job_done", function(e) {
    var d = JSON.parse(e.data);
    // Update the job card summary from the stored job detail
    fetch("/jobs/" + encodeURIComponent(jobId) + "?user=" + encodeURIComponent(getUser()))
      .then(function(r) { return r.json(); })
      .then(function(j) { updateJobCard(j); });
    // Refresh library list since a new playlist.meta.json was written
    refreshPlaylists();
    delete activeSSE[jobId];
    es.close();
  });

  es.onerror = function() {
    // SSE auto-reconnects. After a grace period, check if we still need
    // this connection or if the job is already finished.
    setTimeout(function() {
      if (!activeSSE[jobId]) return;
      fetch("/jobs/" + encodeURIComponent(jobId) + "?user=" + encodeURIComponent(getUser()))
        .then(function(r) {
          if (!r.ok) throw new Error("gone");
          return r.json();
        })
        .then(function(j) {
          if (j.status !== "running") {
            // Job finished (or error) while we were disconnected -- fetch final state
            updateJobCard(j);
            refreshPlaylists();
            delete activeSSE[jobId];
            es.close();
          }
          // else: still running, let SSE reconnect on its own
        })
        .catch(function() {
          // Job gone (server restarted) or network dead -- clean up
          delete activeSSE[jobId];
          es.close();
        });
    }, 3000);
  };
}

async function refreshPlaylists() {
  try {
    const r = await fetch("/playlists?user=" + encodeURIComponent(getUser()));
    const data = await r.json();
    const rows = data.playlists || [];
    const tb = $("#playlists tbody");
    if (!rows.length) {
      for (const folder in knownLib) {
        knownLib[folder].row.remove();
        knownLib[folder].detail.remove();
        delete knownLib[folder];
      }
      tb.innerHTML = '<tr><td colspan="9" class="empty">No playlists yet.</td></tr>';
      return;
    }
    const emptyEl = tb.querySelector(".empty");
    if (emptyEl) emptyEl.remove();

    const folders = new Set();
    for (let i = 0; i < rows.length; i++) {
      const p = rows[i];
      const fid = "lib-" + p.folder;
      folders.add(fid);
      let ctx = knownLib[fid];

      if (!ctx) {
        const row = document.createElement("tr");
        row.className = "lib-row";
        row.dataset.folder = p.folder;
        row.dataset.fid = fid;
        row.onclick = function() { toggleLib(this); };

        const chevTd = document.createElement("td");
        chevTd.className = "lt-chevron";
        chevTd.innerHTML = "\u25b6";
        row.appendChild(chevTd);

        const folderTd = document.createElement("td");
        row.appendChild(folderTd);
        const nameTd = document.createElement("td");
        row.appendChild(nameTd);
        const totalTd = document.createElement("td");
        row.appendChild(totalTd);
        const dlTd = document.createElement("td");
        row.appendChild(dlTd);
        const missTd = document.createElement("td");
        row.appendChild(missTd);
        const fetchTd = document.createElement("td");
        row.appendChild(fetchTd);
        const updateTd = document.createElement("td");
        const updateLink = document.createElement("a");
        updateLink.className = "update-link";
        updateLink.href = "#";
        updateLink.textContent = "update";
        updateLink.dataset.url = p.spotify_url || "";
        updateLink.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          startUpdate(this.dataset.url);
        };
        updateTd.appendChild(updateLink);
        row.appendChild(updateTd);
        const zipTd = document.createElement("td");
        const zipLink = document.createElement("a");
        zipLink.className = "zip-link";
        zipLink.href = "/zip/" + encodeURIComponent(p.folder) + "?user=" + encodeURIComponent(getUser());
        zipLink.textContent = "zip";
        zipLink.onclick = function(e) { e.stopPropagation(); };
        zipTd.appendChild(zipLink);
        row.appendChild(zipTd);

        const detail = document.createElement("tr");
        detail.className = "lib-detail";
        detail.dataset.fid = fid;
        const detailTd = document.createElement("td");
        detailTd.colSpan = 9;
        const inner = document.createElement("div");
        inner.className = "lib-detail-inner";
        inner.id = "inner-" + fid;
        detailTd.appendChild(inner);
        detail.appendChild(detailTd);

        tb.appendChild(row);
        tb.appendChild(detail);

        ctx = { row, detail, chevron: chevTd, inner };
        knownLib[fid] = ctx;
      }

      const cells = ctx.row.children;
      cells[1].textContent = p.folder;
      cells[2].textContent = p.name;
      cells[3].textContent = p.total;
      cells[4].textContent = p.downloaded;
      cells[5].textContent = p.missed;
      cells[6].textContent = p.fetched_at || "";
    }

    for (const fid in knownLib) {
      if (!folders.has(fid)) {
        knownLib[fid].row.remove();
        knownLib[fid].detail.remove();
        delete knownLib[fid];
      }
    }
  } catch {}
}

const libIcons = { downloaded: "\u2713", missed: "\u2717", skipped: "\u27a4", failed: "\u26a0" };

window.toggleLib = async function(row) {
  const fid = row.dataset.fid;
  const folder = row.dataset.folder;
  const ctx = knownLib[fid];
  if (!ctx) return;

  const isOpen = ctx.detail.classList.contains("open");

  if (isOpen) {
    ctx.detail.classList.remove("open");
    ctx.chevron.classList.remove("open");
    return;
  }

  if (!libCache[folder]) {
    ctx.inner.innerHTML = '<div class="empty">loading...</div>';
    try {
      const r2 = await fetch("/library/" + encodeURIComponent(folder) + "?user=" + encodeURIComponent(getUser()));
      const pd = await r2.json();
      libCache[folder] = pd.tracks || [];
    } catch {
      ctx.inner.innerHTML = '<div class="empty">failed to load</div>';
      return;
    }
  }

  const tracks = libCache[folder];
  ctx.inner.innerHTML = tracks.map(function(t) {
    var name = t.artist ? t.artist + " - " + t.title : t.title;
    return '<div class="lib-track">' +
      '<span class="lt-pos">' + t.position + '</span>' +
      '<span class="lt-name">' + esc(name) + '</span>' +
      '<span class="lt-status ' + t.status + '">' + (libIcons[t.status] || "") + '</span>' +
    '</div>';
  }).join("");

  ctx.detail.classList.add("open");
  ctx.chevron.classList.add("open");
};

$("#go").addEventListener("click", async () => {
  const url = $("#url").value.trim();
  if (!url) return;
  $("#msg").textContent = "starting...";
  try {
    const r = await postDownload(url);
    $("#msg").textContent = "job " + r.job_id + " started";
    $("#url").value = "";
    // Ensure the job card exists, then open SSE for live progress
    var ctx = ensureJobCard({ id: r.job_id, url: url, user: getUser(), status: "running" });
    ctx.metaEl.innerHTML = '<span class="badge running">running</span> &nbsp; ' + esc(url);
    watchJob(r.job_id);
    // One-time fetch of the list view (lightweight)
    refreshJobs();
  } catch (e) {
    $("#msg").textContent = "error: " + e.message;
  }
});

// Re-download a playlist already in the library (Update button). Reuses the
// existing /download endpoint with the playlist's stored Spotify URL; the
// backend skip-check means only missing/partial tracks are actually fetched.
async function startUpdate(url) {
  if (!url) { $("#msg").textContent = "error: playlist has no stored Spotify URL"; return; }
  $("#msg").textContent = "updating playlist...";
  try {
    const r = await postDownload(url);
    $("#msg").textContent = "job " + r.job_id + " started (update)";
    var ctx = ensureJobCard({ id: r.job_id, url: url, user: getUser(), status: "running" });
    ctx.metaEl.innerHTML = '<span class="badge running">running</span> &nbsp; ' + esc(url);
    watchJob(r.job_id);
    refreshJobs();
  } catch (e) {
    $("#msg").textContent = "error: " + e.message;
  }
}

async function tick() {
  await refreshHealth();
  await refreshJobs();
  await refreshPlaylists();
}
tick();

/* ---- heartbeat: check server every 10s, reload if it comes back ---- */
(function heartbeat() {
  var wasDown = false;
  setInterval(function() {
    fetch("/health")
      .then(function(r) {
        if (r.ok) {
          if (wasDown) {
            wasDown = false;
            location.reload();
          }
        } else {
          wasDown = true;
          $("#health").textContent = "degraded";
          $("#health").className = "bad";
        }
      })
      .catch(function() {
        wasDown = true;
        $("#health").textContent = "server down";
        $("#health").className = "bad";
      });
  }, 10000);
})();
</script>
